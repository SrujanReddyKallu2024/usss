<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-left">
                <div class="logo">🏠</div>
                <div>
                    <h1>Real Estate AI</h1>
                    <p class="subtitle">NL2SQL · RAG · Smart Assistant</p>
                </div>
            </div>
            <div class="header-right">
                <span class="status-dot"></span>
                <span class="status-text">Online</span>
            </div>
        </header>

        <div class="chat-area" id="chatArea">
            <div class="welcome" id="welcome">
                <div class="welcome-icon">🤖</div>
                <h2>Hey Nagendra!</h2>
                <p>I can query your database or answer policy questions. Try one:</p>
                <div class="chips">
                    <button class="chip" onclick="sendChip(this)">Show available apartments in Dallas under 1800</button>
                    <button class="chip" onclick="sendChip(this)">Which tenants have overdue payments?</button>
                    <button class="chip" onclick="sendChip(this)">What is the late payment policy?</button>
                    <button class="chip" onclick="sendChip(this)">Show leases expiring soon</button>
                    <button class="chip" onclick="sendChip(this)">How many properties in each city?</button>
                    <button class="chip" onclick="sendChip(this)">What is the lease renewal process?</button>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Ask about properties, tenants, payments, policies..."
                    autocomplete="off"
                />
                <button id="sendBtn" onclick="sendMessage()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
